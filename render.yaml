# Render Blueprint for Bartcash — FREE setup: one web service that runs the
# API and the pg-boss worker in the same process (workers have no free tier).
# Put this file at the REPO ROOT (BartCash/render.yaml), not inside backend/.
#
# Adjust `region` to match your Supabase project's region:
# oregon, ohio, virginia, frankfurt, singapore.
#
# PORT is injected by Render — do not set it here.
# Secrets use `sync: false`: Render prompts for them in the dashboard.

services:
  - type: web
    name: bartcash-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER            # API process also consumes pg-boss jobs
        value: "true"
      - key: DATABASE_URL          # Supabase SESSION pooler string (port 5432)
        sync: false
      - key: JWT_SECRET            # NEW random value, not your local one
        sync: false
      - key: CLIENT_URL            # web origins for CORS; leave empty (no web build)
        sync: false
      - key: API_BASE_URL          # https://<service>.onrender.com/api (password-reset links)
        sync: false
      # Cloudflare R2 (S3-compatible, Laravel-style names)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # AI valuation (Groq)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_RPM              # one process holds the whole key: 25 of Groq's 30/min
        value: "25"
      # Email (SendLibs)
      - key: SENDLIBS_API_KEY
        sync: false
      - key: MAIL_FROM_NAME
        value: Bartcash
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Qloo taste intelligence. Set QLOO_ENABLED in the dashboard (false for
      # the first deploy, then true) so a Blueprint sync never flips it.
      - key: QLOO_ENABLED
        sync: false
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_RPS              # one process: stay under Qloo's shared 4/s
        value: "3"
      - key: QLOO_TIMEOUT_MS       # uncached searches took up to 6.4 s (Oct 22)
        value: "8000"
      - key: QLOO_BUDGET_SOFT_STOP # remaining monthly calls: background work stops
        value: "1000"
      - key: QLOO_BUDGET_HARD_STOP # remaining monthly calls: all Qloo calls stop
        value: "200"
